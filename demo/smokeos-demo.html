.xterm {

}

.xterm.focus,

    /**
     * The z-index of the helpers must be higher than the canvases in order for

:root{
  --bg:#0d0f12;--panel:#15181d;--panel2:#1b1f26;--line:#262b33;--text:#e6e8eb;--muted:#8b93a1;
  --accent:#ff7a1a;--ok:#2ecc71;--warn:#f5b301;--crit:#ff4d4f;--blue:#4da3ff;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted)}

/* top bar */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(13,15,18,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px}
.brand img{width:26px;height:26px}
.brand span{color:var(--accent)}
header .spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;
  white-space:nowrap}
.btn:hover{border-color:#3a414c}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.btn.danger{color:var(--crit)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

main{max-width:1200px;margin:0 auto;padding:16px}

/* totals */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px}
@media (max-width:640px){.totals{grid-template-columns:repeat(2,1fr)}}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.alert{border-radius:10px;padding:8px 12px;font-size:14px;border:1px solid}
.alert.crit{background:rgba(255,77,79,.1);border-color:rgba(255,77,79,.4)}
.alert.warn{background:rgba(245,179,1,.08);border-color:rgba(245,179,1,.35)}

/* rig cards */
.rig{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.rig-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(46,204,113,.6)}
.dot.off{background:var(--crit)}
.dot.warn{background:var(--warn)}
.rig-name{font-weight:700;font-size:17px}
.rig-meta{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;font-size:14px}
.rig-meta b{font-weight:700}
.chev{transition:transform .15s;color:var(--muted)}
.rig.open .chev{transform:rotate(90deg)}
.rig-body{display:none;border-top:1px solid var(--line);padding:12px 14px}
.rig.open .rig-body{display:block}

.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--muted)}
.tag.crit{color:var(--crit);border-color:rgba(255,77,79,.4)}
.tag.warn{color:var(--warn);border-color:rgba(245,179,1,.35)}

/* gpu table */
.tablewrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-crit{color:var(--crit);font-weight:700}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 6px}
.tune{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tune select,.tune input{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;width:auto}
.tune input{width:110px}

.chartbox{position:relative;height:200px}
.ranges{display:flex;gap:6px;margin-bottom:6px}
.ranges .btn.active{border-color:var(--accent);color:var(--accent)}

pre.log{background:#0a0b0d;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:260px;overflow:auto;
  font-size:12px;margin:0;white-space:pre-wrap;word-break:break-all}
.list{font-size:13px}
.list div{padding:4px 0;border-bottom:1px solid var(--line)}
.list div:last-child{border-bottom:0}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;width:100%}
.modal h3{margin:0 0 10px}
.modal input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:6px 0 12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.tokenbox{background:#0a0b0d;border:1px solid var(--line);border-radius:9px;padding:10px;word-break:break-all;margin:8px 0}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;display:none}
.toast.show{display:block}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
.login h1{margin:0 0 4px;font-size:22px}
.login label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.login input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.login button{width:100%;margin-top:18px;padding:11px}
.login .err{color:var(--crit);font-size:14px;margin-top:10px;min-height:20px}

.badge{display:inline-block;margin-left:6px;background:var(--accent);color:#111;border-radius:999px;
  font-size:11px;font-weight:700;padding:0 6px;line-height:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.kv div:nth-child(odd){color:var(--muted)}
.notes{background:#0a0b0d;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:160px;overflow:auto;
  font-size:13px;white-space:pre-wrap;margin:8px 0}
.box .actions{margin:8px 0 0}
.box{max-height:90vh;overflow:auto}
@media (max-width:640px){header{flex-wrap:wrap} header #updated{display:none}}
.badge[hidden]{display:none}

table.oc{min-width:720px}
table.oc input{width:86px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
table.oc th{white-space:nowrap;line-height:1.2}

.homebox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);margin-bottom:6px}
.homehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.homebox p{margin:6px 0}
.kv input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* ---------- v1.2 layout: farm list, rig page with tabs, flight sheets, shell ---------- */
a{text-decoration:none}
.brand{color:var(--text)}
.mainnav{display:flex;gap:4px;margin-left:10px}
.mainnav a{color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600}
.mainnav a.active,.mainnav a:hover{color:var(--text);background:var(--panel2)}
.small{font-size:12px}
a.alert{display:block;color:var(--text)}

.farmlist{display:flex;flex-direction:column;gap:8px}
.farmrow{display:grid;grid-template-columns:14px minmax(140px,1.3fr) minmax(140px,1.4fr) minmax(90px,.8fr) minmax(120px,1.4fr) 70px minmax(0,1.6fr);
  align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;color:var(--text)}
.farmrow:hover{border-color:#3a414c}
.farmrow > span{min-width:0}
.fr-name,.fr-fs{display:flex;flex-direction:column;overflow:hidden}
.fr-name b,.fr-fs b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-name .muted,.fr-fs .muted{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-hr{font-weight:700;font-variant-numeric:tabular-nums}
.fr-chips{display:flex;flex-wrap:wrap;gap:4px}
.fr-pw{font-variant-numeric:tabular-nums;color:var(--muted)}
.fr-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chip{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
@media (max-width:900px){.farmrow{grid-template-columns:14px 1fr auto;grid-template-areas:"d n h" "d f p" "d c c" "d t t"}
  .farmrow .dot{grid-area:d;align-self:start;margin-top:5px}.fr-name{grid-area:n}.fr-hr{grid-area:h;text-align:right}.fr-fs{grid-area:f}
  .fr-pw{grid-area:p;text-align:right}.fr-chips{grid-area:c}.fr-tags{grid-area:t;justify-content:flex-start}}

.righead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back{color:var(--muted);font-weight:600}
.back:hover{color:var(--text)}
.switcher{position:relative}
.switchbtn{font-size:17px;padding:6px 12px}
.switchpop{position:absolute;top:calc(100% + 6px);left:0;z-index:15;width:300px;max-width:85vw;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.switchpop input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.switchpop a{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;color:var(--text);font-weight:600}
.switchpop a:hover{background:var(--panel2)}
.switchpop a .muted{margin-left:auto;font-weight:400;font-size:12px}
.rigactions{display:flex;gap:6px;flex-wrap:wrap}
.statusbox{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.sb-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.sb-fs{display:flex;align-items:center;gap:8px}
.sb-hr{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.sb-gpus{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.gt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:6px 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.35}
.gt .muted{font-weight:500;font-size:12px}
.infoline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:10px 2px}
.infoline b{color:var(--text);font-size:11px;letter-spacing:.6px;margin-right:3px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 14px;overflow-x:auto}
.tabs a{color:var(--muted);padding:10px 12px;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600}
.tabs a:hover{color:var(--text)}
.tabs a.active{color:var(--text);border-bottom-color:var(--accent)}
td.nv{color:#86d36b} td.amd{color:#d56bd0}

.systiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.systiles .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.systiles .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
@media (max-width:900px){.systiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.systiles{grid-template-columns:repeat(2,1fr)}}
.sysdetails{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:14px}
.sysdetails .muted{display:inline-block;min-width:96px}
@media (max-width:640px){.sysdetails{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.panel p{margin:8px 0}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.formgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.formgrid label.wide{grid-column:1/-1}
.formgrid input,.formgrid select,.fs-pick select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text)}
@media (max-width:640px){.formgrid,.formgrid.two{grid-template-columns:1fr}}
.switchrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switchrow input{width:18px;height:18px;accent-color:var(--accent)}
.fs-pick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.fs-pick select{flex:1;min-width:200px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pagehead h2{margin:4px 0}
.fsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:12px}
@media (max-width:420px){.fsgrid{grid-template-columns:1fr}}
.fscard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fs-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fs-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fs-bottom .actions{margin:0}
pre.cmdres{background:#0a0b0d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#c9ced6}
.checklist label{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.checklist input{accent-color:var(--accent);width:16px;height:16px}
.box select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text)}
.box .formgrid input{margin:0}
.ranges .btn.active{border-color:var(--accent);color:var(--accent)}
.chartbox{height:320px}

.termwrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.termwrap[hidden]{display:none}
.termbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-bottom:0;border-radius:12px 12px 0 0;padding:8px 12px}
#termEl{flex:1;min-height:0;background:#0a0b0d;border:1px solid var(--line);border-radius:0 0 12px 12px;padding:6px}
[hidden]{display:none!important}

/* ---------- phone layout ---------- */
.menubtn{display:none;position:relative}
.menubtn .badge{position:absolute;top:-6px;right:-6px;margin:0}
.hdractions{display:flex;gap:8px;align-items:center}
@media (max-width:640px){
  header{flex-wrap:nowrap;gap:8px}
  .brand{font-size:15px}
  .mainnav{margin-left:2px}
  .mainnav a{padding:6px 8px;font-size:14px}
  .menubtn{display:inline-block}
  .hdractions{display:none;position:absolute;top:100%;right:max(12px,env(safe-area-inset-right,0px));flex-direction:column;align-items:stretch;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:20}
  .hdractions.open{display:flex}
  .hdractions .btn{text-align:left;padding:10px 12px;font-size:15px}
  main{padding-top:12px}
  .long{display:none}
  .righead{gap:8px}
  .back{order:0}
  .switcher{order:1;flex:1;min-width:0}
  .switchbtn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .righead .spacer{display:none}
  .rigactions{order:2;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rigactions .btn{padding:9px 4px;font-size:13px;text-align:center}
  .statusbox{padding:12px}
  .sb-hr{font-size:24px}
  .sb-gpus{width:100%}
  .gt{flex:1;min-width:52px}

    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{padding:10px 9px}

/* ---------- Hive-style touches: summary strip, heat colours, bottom bar ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--ok) 70%,var(--crit))}
.st .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.st .v small{font-size:12px;color:var(--muted);font-weight:500}
.st .v sup{font-size:13px;margin-left:6px}
.st .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.bolt{color:var(--blue);margin-right:4px}
.h-g{background:#1f6b3a;color:#e9fff1}.h-y{background:#e1c12f;color:#1b1500}.h-o{background:#ef8a2c;color:#1b0d00}.h-r{background:#e5484d;color:#fff}
.h-b{background:#4b5bd6;color:#fff}.h-n{background:var(--panel2);color:var(--muted)}
.chip.h-g,.chip.h-y,.chip.h-o,.chip.h-r{border-color:transparent}
.gt{padding:0;overflow:hidden;gap:0;min-width:58px}
.gt > div{width:100%;text-align:center;padding:3px 6px}
.gt-t{font-size:15px}.gt-f{font-size:13px}.gt-p{font-size:12px;color:var(--muted);font-weight:500}
.fr-up{font-size:12px}
.evchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.evchip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:#7fd88f}
.evchip.warn{color:var(--warn)}.evchip.crit{color:var(--crit)}.evchip.cmd{color:var(--blue)}
.spark{position:relative;height:90px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.spark canvas{position:absolute;inset:0}
.spark-v{position:absolute;top:6px;right:10px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.bottombar{display:none}
.modal.bottom{align-items:flex-end;padding:0}
.modal.bottom .box{border-radius:16px 16px 0 0;max-width:640px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{display:flex;flex-direction:column;gap:8px}
.sheet h3{margin:0 0 4px}
.sheetbtn{padding:13px 14px;font-size:16px;text-align:left}
@media (max-width:640px){
  .menubtn,.hdractions{display:none!important}
  .tabs{display:none}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,15,18,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bottombar a,.bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);

  .bottombar .bi{font-size:20px;line-height:24px;position:relative}
  .bottombar .bi .badge{position:absolute;top:-4px;right:-14px;margin:0;font-size:10px}
  .bottombar .active{color:var(--accent)}
  .strip{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .st{min-width:120px}
  .farmrow{grid-template-columns:1fr auto;grid-template-areas:"n h" "u f" "c c" "t t";gap:4px 10px;padding:10px 12px}

  .fr-chips{justify-content:flex-start}

  .gt{min-width:0}
}

@media (max-width:640px){

    if (!r.online || !r.report.hashrate) continue;
    const c = (r.report.flightsheet && r.report.flightsheet.coin) || (r.report.miner && r.report.miner.name) || "?";

}

    try {
      const [log, hist] = await Promise.all([api(`/api/rigs/${r.id}/log`), api(`/api/rigs/${r.id}/history?hours=6`)]);
      c.events = [...log.events.map((e) => ({ ts: e.ts, lvl: e.level, msg: e.message })),
        ...log.commands.filter((x) => x.type !== "open_shell").map((x) => ({ ts: x.created, lvl: x.status === "failed" ? "warn" : "cmd", msg: `${x.type.replace(/_/g, " ")} ${x.status}` }))]
        .sort((a, b) => b.ts - a.ts).slice(0, 6);

async function loadHistory(id) {
  const u = ui(id), cv = $("#chart"); if (!cv || !window.Chart) return;
  let j; try { j = await api(`/api/rigs/${id}/history?hours=${u.range}`); } catch { return; }
  const pts = j.points;
  const labels = pts.map((p) => { const d = new Date(p.ts * 1000); return u.range > 24 ? d.toLocaleDateString([], { weekday: "short" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); });
  const maxHR = Math.max(1, ...pts.map((p) => p.hashrate || 0)), units = ["H/s", "kH/s", "MH/s", "GH/s", "TH/s", "PH/s"];
  let div = 1, ui_ = 0; while (maxHR / div >= 1000 && ui_ < units.length - 1) { div *= 1000; ui_++; }
  if (u.chart) u.chart.destroy();
  u.chart = new Chart(cv, {
    type: "line",
    data: { labels, datasets: [
      { label: `Hashrate (${units[ui_]})`, data: pts.map((p) => (p.hashrate || 0) / div), borderColor: "#ff7a1a", backgroundColor: "rgba(255,122,26,.12)", fill: true, yAxisID: "y", pointRadius: 0, tension: .25, borderWidth: 2 },
      { label: "Power (W)", data: pts.map((p) => p.power), borderColor: "#4da3ff", yAxisID: "y1", pointRadius: 0, tension: .25, borderWidth: 1.5 },
      { label: "Hottest °C", data: pts.map((p) => p.max_temp), borderColor: "#ff4d4f", yAxisID: "y1", pointRadius: 0, tension: .25, borderWidth: 1, borderDash: [4, 3] }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#8b93a1", boxWidth: 12 } } },
      scales: { x: { ticks: { color: "#8b93a1", maxTicksLimit: 7 }, grid: { color: "#1f242b" } },
        y: { beginAtZero: true, ticks: { color: "#ff7a1a" }, grid: { color: "#1f242b" } },
        y1: { position: "right", beginAtZero: true, ticks: { color: "#4da3ff" }, grid: { display: false } } } },
  });
}

  };
  $("#shGo").onclick = go_;
  $("#shCode").onkeydown = (e) => { if (e.key === "Enter") go_(); };
}
function startTerm(r, sid) {
  closeTerm();
  SH.sid = sid;
  $("#termRig").textContent = r.name; $("#termState").textContent = "connecting…";
  $("#termwrap").hidden = false;
  const term = new Terminal({ cursorBlink: true, fontSize: 14, fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
    theme: { background: "#0a0b0d", foreground: "#e6e8eb", cursor: "#ff7a1a", selectionBackground: "#ff7a1a55" }, scrollback: 5000 });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
  term.open($("#termEl")); fit.fit(); term.focus();
  term.writeln("\x1b[90mWaiting for the rig to connect…\x1b[0m");
  SH.term = term; SH.fit = fit;
  let got = false;
  const send = (body) => api(`/api/shell/${sid}/input`, { method: "POST", body: JSON.stringify(body) }).catch(() => {});
  send({ cols: term.cols, rows: term.rows });
  term.onData((d) => { SH.queue += d; if (!SH.timer) SH.timer = setTimeout(() => { const q = SH.queue; SH.queue = ""; SH.timer = null; send({ d: b64enc(q) }); }, 8); });
  term.onResize(({ cols, rows }) => send({ cols, rows }));
  SH.onresize = () => { try { fit.fit(); } catch (e) { /* hidden */ } };
  window.addEventListener("resize", SH.onresize);
  const es = new EventSource(`/api/shell/${sid}/stream`);
  SH.es = es;
  es.onmessage = (e) => {
    const j = JSON.parse(e.data);
    if (!j.d) return;
    if (!got) { got = true; term.reset(); $("#termState").textContent = "connected"; }
    term.write(b64dec(j.d));
  };
  es.addEventListener("closed", () => { term.writeln("\r\n\x1b[90m[shell closed]\x1b[0m"); $("#termState").textContent = "closed"; es.close(); });
  es.onerror = () => { if (es.readyState === 2) $("#termState").textContent = "disconnected"; };
  setTimeout(() => { if (!got && SH.sid === sid) term.writeln("\x1b[33mStill waiting… the rig may be busy or offline.\x1b[0m"); }, 15000);
}
function closeTerm() {
  if (SH.sid) api(`/api/shell/${SH.sid}/close`, { method: "POST" }).catch(() => {});
  if (SH.es) SH.es.close();
  if (SH.term) SH.term.dispose();
  if (SH.onresize) window.removeEventListener("resize", SH.onresize);
  Object.assign(SH, { sid: null, es: null, term: null, fit: null, queue: "", timer: null, onresize: null });
  $("#termEl").innerHTML = ""; $("#termwrap").hidden = true;
}
$("#termClose").onclick = closeTerm;

      <div class="kv"><div>Dashboard link for away</div><div><input id="homeUrl" placeholder="https://box.tail1234.ts.net" value="${esc(home.public_url || "")}"></div>
        <div>Tailscale key</div><div><input id="homeKey" type="password" placeholder="${home.tailscale_key_set ? "saved ✓ (type to replace)" : "tskey-auth-… (reusable)"}"></div></div>
      <p class="muted small">Rigs added at home get these two, so they keep working after you move them to the apartment.</p>

    </div>

    <div class="kv"><div>SERVER_URL</div><div class="mono">${esc(home.public_url || DEMO.serverUrl)}</div>
      <div>FARM_KEY</div><div class="mono" id="fk">••••••••••••••••</div></div>
    <div class="actions"><button class="btn small" id="showFk">Show</button><button class="btn small" id="copyFk">Copy farm key</button>
      <button class="btn small danger" id="rotFk">New farm key</button></div>
    <p class="muted"><b>Existing Ubuntu / HiveOS rig:</b> create it here and paste the token into its agent.json.</p>
    <input id="rigName" placeholder="Rig name, e.g. Big_Smoke" maxlength="40">
    <div class="row"><button class="btn" id="cancelRig">Close</button><button class="btn primary" id="saveRig">Create + get token</button></div>`);
  $("#homeToggle").onclick = async () => { try { await api("/api/home", { method: "POST", body: JSON.stringify({ auto_add: !home.auto_add }) }); addRig(); } catch (e) { toast(e.message); } };
  $("#homeSave").onclick = async () => {
    const b = { public_url: $("#homeUrl").value };
    if ($("#homeKey").value.trim()) b.tailscale_authkey = $("#homeKey").value.trim();
    try { await api("/api/home", { method: "POST", body: JSON.stringify(b) }); toast("Saved"); addRig(); } catch (e) { toast(e.message); }
  };
  $("#showFk").onclick = () => { $("#fk").textContent = fk; };
  $("#copyFk").onclick = () => copy(fk, "Farm key copied");
  $("#rotFk").onclick = async () => {
    if (!(await confirmBox("Make a new farm key? Rigs already added keep working; new USBs need the new key.", "New key", true))) return addRig();
    try { await api("/api/farm/rotate", { method: "POST" }); toast("New farm key made"); } catch (e) { toast(e.message); }
    addRig();
  };
  $("#cancelRig").onclick = closeModal;
  $("#saveRig").onclick = async () => {
    try { const j = await api("/api/rigs", { method: "POST", body: JSON.stringify({ name: $("#rigName").value }) }); showToken(j.name, j.token); refresh(); }
    catch (e) { toast(e.message); }
  };
}
$("#addRig").onclick = addRig;

async function showUpdates() {
  let u; try { u = await api("/api/updates"); } catch (e) { return toast(e.message); }
  const newer = u.latest && cmpVer(u.latest, u.server_version) > 0;
  const old = u.rigs.filter((r) => u.latest && r.version && cmpVer(u.latest, r.version) > 0);
  modal(`<h3>Updates</h3>
    <div class="kv">
      <div>Server</div><div>v${esc(u.server_version)}</div>
      <div>Latest release</div><div>${u.latest ? "v" + esc(u.latest) : "–"}</div>
      <div>GitHub repo</div><div class="mono">${esc(u.repo || "not set")}</div>
      <div>Signing key</div><div>${u.signed ? "✓ verified releases only" : "<span class='t-crit'>missing</span>"}</div>
      <div>Last check</div><div>${u.checking ? "checking…" : u.last_check ? new Date(u.last_check * 1000).toLocaleString() : "never"}</div>
    </div>
    ${u.error ? `<div class="alert warn">${esc(u.error)}</div>` : ""}
    ${u.notes ? `<div class="notes">${esc(u.notes)}</div>` : ""}
    <div class="section-title">Rigs</div>
    <div class="list">${u.rigs.map((r) => `<div>${esc(r.name)} — v${esc(r.version || "?")} ${u.latest && r.version && cmpVer(u.latest, r.version) > 0 ? '<span class="tag warn">update available</span>' : '<span class="tag">up to date</span>'} ${r.online ? "" : '<span class="muted">(offline)</span>'}</div>`).join("") || "No rigs"}</div>
    <div class="actions">
      <button class="btn small" id="updCheck">Check now</button>
      <button class="btn small ${old.length ? "primary" : ""}" id="updRigs" ${old.length ? "" : "disabled"}>Update ${old.length} rig(s)</button>
      <button class="btn small ${newer ? "primary" : ""}" id="updServer" ${newer ? "" : "disabled"}>Update server</button>
    </div>
    <p class="muted small">Rigs with AUTO_UPDATE on install new releases by themselves within a minute of the server downloading them.</p>
    <div class="row"><button class="btn" id="updClose">Close</button></div>`);
  $("#updClose").onclick = closeModal;
  $("#updCheck").onclick = async () => { await api("/api/updates/check", { method: "POST" }).catch((e) => toast(e.message)); toast("Checking GitHub…"); setTimeout(showUpdates, 4000); };
  $("#updRigs").onclick = async () => { try { const j = await api("/api/updates/rigs", { method: "POST" }); toast(`Update sent to ${j.queued} rig(s)`); closeModal(); } catch (e) { toast(e.message); } };
  $("#updServer").onclick = async () => {
    if (!(await confirmBox(`Update the server to v${u.latest}? The dashboard restarts (about 10 s).`, "Update"))) return showUpdates();
    try { await api("/api/updates/server", { method: "POST" }); toast("Server updating – back in a few seconds"); setTimeout(refresh, 3500); } catch (e) { toast(e.message); }
  };
}
$("#updBtn").onclick = showUpdates;

    <div class="row"><button class="btn" id="closeAudit">Close</button></div>`);

// ------------------------------------------------------------------ refresh loop
async function refresh() {
  try { DATA = await api("/api/rigs"); } catch { $("#updated").textContent = "offline"; return; }
  const outdated = DATA.rigs.filter((r) => r.outdated).length + (DATA.latest && cmpVer(DATA.latest, DATA.version) > 0 ? 1 : 0);
  $("#updBadge").hidden = !outdated; $("#updBadge").textContent = outdated;
  $("#menuBadge").hidden = !outdated; $("#menuBadge").textContent = outdated;
  const crit = DATA.rigs.reduce((n, r) => n + r.alerts.filter((a) => a.level === "crit").length, 0);
  document.title = crit ? `(${crit}) SmokeOS` : "SmokeOS";
  $("#updated").textContent = "live";
  render(false);
}
refresh().then(() => render(true));
setInterval(refresh, 5000);
setInterval(() => { if (ROUTE.view === "rig") { if (ROUTE.tab === "stats") loadHistory(ROUTE.id); if (ROUTE.tab === "activity") loadLog(ROUTE.id); } }, 30000);


</script>
