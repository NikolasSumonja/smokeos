<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmokeOS · Login</title>
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmokeOS">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login">
  <form id="f" autocomplete="on">
    <div class="brand"><img src="/static/icon.svg" alt=""><h1>Smoke<span>OS</span></h1></div>
    <div class="muted">Mining farm dashboard</div>
    <label>Username<input name="username" autocomplete="username" required autocapitalize="off"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <label>2FA code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required></label>
    <button class="btn primary" type="submit">Log in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script src="/static/login.js"></script>
</body>
</html>
