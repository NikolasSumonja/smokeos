# =============================================================================
#  SmokeOS rig settings
#  Edit this file on any computer (it's on the "SMOKEOS" drive that shows up
#  when you plug the USB in). Changes apply on the next boot.
# =============================================================================

# Name shown on the dashboard. Leave empty for an automatic name like rig-3f9a1c
# (you can rename it on the dashboard). Letters, numbers, - and _ only.
RIG_NAME=

# ---- At home you can leave everything below empty -----------------------------
# With "home plug-and-play" on, a rig plugged into your home network finds the
# dashboard by itself, adds itself, and gets the Tailscale key and dashboard link
# it needs to keep working after you move it somewhere else.

# Dashboard address. Only needed for a rig that has never been on your home network.
SERVER_URL=

# Farm key (dashboard -> "+ Rig"). Only needed together with SERVER_URL above.
FARM_KEY=

# Tailscale auth key. Only needed together with SERVER_URL above
# (the dashboard hands it to rigs added on the home network).
TAILSCALE_AUTHKEY=

# Miner command. %RIG_NAME% is replaced with the name above.
# Pearl (RTX 30/40/50, RX 6000+) with KRig:
MINER_CMD=/opt/smokeos/miners/krig/krig-miner --url prl-us.kryptex.network:8048 --user krxX8K7VD2/%RIG_NAME%
# Pearl with SRBMiner (what HiveOS runs) instead of KRig:
#MINER_CMD=/opt/smokeos/miners/srbminer/SRBMiner-MULTI --disable-cpu --algorithm pearlhash --pool prl-us.kryptex.network:7048 --wallet krxX8K7VD2/%RIG_NAME%
# Zano on P106 / GTX 10xx with T-Rex (remove the # to use it, put a # on the line above):
#MINER_CMD=/opt/smokeos/miners/t-rex/t-rex -a progpowz -o stratum+tcp://YOUR_ZANO_POOL:PORT -u YOUR_ZANO_WALLET.%RIG_NAME%

# Leave empty to only monitor (no miner).
#MINER_CMD=

# Power limits / core locks applied at every start.  GPU:VALUE, comma separated.
POWER_LIMITS=
CORE_LOCKS=

# Temp guard: pause mining at TEMP_LIMIT, resume below COOL_TEMP (°C).
TEMP_LIMIT=83
COOL_TEMP=65

# Install SmokeOS updates automatically when you publish a new release.
AUTO_UPDATE=yes

# Optional: password for logging in with a keyboard + monitor plugged into the rig
# (user "root"). Leave empty to disable local password login.
# Remote access uses Tailscale SSH instead:  ssh root@My_Rig
ROOT_PASSWORD=
